name=WaveshareAMOLED
version=1.0.3
author=kalioz
maintainer=kalioz
sentence=A fast, dependency free RGB888 driver for the Waveshare ESP32-S3-Touch-AMOLED-1.43 round AMOLED (SH8601/CO5300 + FT3168 touch).
paragraph=Real 24 bit colour (16.7M) over QSPI with a double buffered strip pipeline, a TFT_eSPI style drawing API (pixels, lines, rectangles, circles, text, radial glows and arcs), touch, brightness control, an optional full frame PSRAM framebuffer and word aligned partial updates (pushRect + setClip) for dirty rectangle animation. Uses only the ESP-IDF esp_lcd layer that ships inside the Arduino-ESP32 core plus Wire - nothing else to install.
category=Display
url=https://docs.waveshare.com/ESP32-S3-Touch-AMOLED-1.43
architectures=esp32
includes=WaveshareAMOLED.h
